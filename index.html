<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- === АНТИ-КЭШ: Заставляем браузер всегда грузить новую версию === -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ============================================================== -->

<title>Lumina Store</title>
<style>
    /* Премиальный яркий дизайн с глассморфизмом */
    * {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .header-block { text-align: center; margin-bottom: 25px; }

    h2 {
        margin: 0 0 5px 0;
        font-size: 32px;
        font-weight: 800;
        background: linear-gradient(to right, #f857a6, #ff5858);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 15px rgba(248, 87, 166, 0.3);
    }

    p.subtitle {
        font-size: 15px;
        color: #b3b3b3;
        margin: 0;
        font-weight: 500;
        letter-spacing: 1px;
    }

    .container {
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 30px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .btn {
        width: 100%;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
    }

    .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
    
    .btn-install {
        margin-top: 15px;
        background: linear-gradient(45deg, #ff416c, #ff4b2b);
        color: #ffffff;
        font-weight: 700;
        font-size: 18px;
        justify-content: center;
        border: none;
        box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    .btn-install:hover { 
        background: linear-gradient(45deg, #ff4b2b, #ff416c);
        box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        transform: translateY(-2px);
    }

    .status-message {
        margin-top: 0;
        text-align: center;
        font-size: 15px;
        font-weight: 600;
        color: #00f2fe;
        opacity: 0;
        height: 0;
        overflow: hidden;
        transition: all 0.4s ease;
    }
    
    .status-message.show { opacity: 1; height: auto; margin-top: 20px; }

    .sheet-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        display: none;
        justify-content: center;
        align-items: flex-end;
        z-index: 100;
    }

    .sheet-overlay.active { display: flex; }

    .sheet-modal {
        width: 100%;
        max-width: 400px;
        height: 75vh;
        background: linear-gradient(180deg, #1e1e2f 0%, #12121c 100%);
        border-radius: 30px 30px 0 0;
        padding: 25px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: none;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    .sheet-header h3 { margin: 0; font-size: 20px; font-weight: 700; }

    .close-btn {
        background: rgba(255, 255, 255, 0.1); border: none; color: #fff;
        border-radius: 50%; width: 34px; height: 34px; cursor: pointer;
        font-size: 16px; display: flex; justify-content: center; align-items: center;
        transition: background 0.3s;
    }
    
    .close-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .search-input {
        width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
        color: #fff; font-size: 16px; margin-bottom: 20px; outline: none;
        transition: border 0.3s, box-shadow 0.3s;
    }

    .search-input:focus { border-color: #f857a6; box-shadow: 0 0 10px rgba(248, 87, 166, 0.3); }
    .search-input::placeholder { color: #888; }

    .sheet-list {
        flex: 1; overflow-y: auto; display: flex; flex-direction: column;
        gap: 12px; padding-right: 5px;
    }

    .sheet-list::-webkit-scrollbar { width: 6px; }
    .sheet-list::-webkit-scrollbar-track { background: transparent; }
    .sheet-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .sheet-item {
        display: flex; align-items: center; padding: 12px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px; cursor: pointer; transition: all 0.2s ease;
    }

    .sheet-item:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.02); border-color: rgba(255, 255, 255, 0.2); }

    .app-icon {
        width: 48px; height: 48px; border-radius: 12px; overflow: hidden;
        margin-right: 15px; background: #444; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .app-name { font-size: 17px; font-weight: 600; }
</style>
</head>
<body>

<div class="header-block">
    <h2>Murad Shop</h2>
    <p class="subtitle">Каталог удалённых приложений</p>
</div>

<div class="container">
    <button type="button" class="btn" onclick="openSheet()">
        <span id="selectedAppText">Нажмите для выбора...</span>
        <span>›</span>
    </button>
    
    <button type="button" class="btn btn-install" onclick="startInstallation()">
        Установить
    </button>

    <div id="statusMessage" class="status-message">
        ✨ Загрузка началась! Ожидайте на рабочем столе...
    </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
    <div class="sheet-modal" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3>Выбор приложения</h3>
            <button type="button" class="close-btn" onclick="closeSheet()">✕</button>
        </div>

        <input type="text" id="appSearchInput" class="search-input" placeholder="Поиск по названию..." oninput="filterApps()" autocomplete="off">

        <div class="sheet-list">
            
            <!-- ПРИЛОЖЕНИЕ 1: ВКонтакте -->
            <div class="sheet-item" onclick="selectApp('itms-services://?action=download-manifest&url=https://Gadlimurad.github.io/muradshop/vk.plist', 'ВКонтакте')">
                <div class="app-icon">
                    <img src="https://i.pinimg.com/736x/92/a9/dc/92a9dc918ad00d529922958f603ede6d.jpg" alt="ВК">
                </div>
                <span class="app-name">ВКонтакте</span>
            </div>

            <!-- ПРИЛОЖЕНИЕ 2: Амина -->
            <div class="sheet-item" onclick="selectApp('itms-services://?action=download-manifest&url=https://Gadlimurad.github.io/muradshop/Amina.plist', 'Амина')">
                <div class="app-icon">
                    <!-- Заглушка вместо нерабочего слова ИКОНКА -->
                    <img src="https://ui-avatars.com/api/?name=A&background=f857a6&color=fff" alt="Амина">
                </div>
                <span class="app-name">Амина</span>
            </div>
            
            <!-- В БУДУЩЕМ ВСТАВЛЯЙТЕ НОВЫЕ ПРИЛОЖЕНИЯ СТРОГО СЮДА (выше закрывающего тега div) -->
            <!--
            <div class="sheet-item" onclick="selectApp('itms-services://?action=download-manifest&url=ССЫЛКА_НА_PLIST', 'НАЗВАНИЕ')">
                <div class="app-icon"><img src="ССЫЛКА_НА_КАРТИНКУ" alt="НАЗВАНИЕ"></div>
                <span class="app-name">НАЗВАНИЕ</span>
            </div>
            -->

        </div>
    </div>
</div>

<script>
    // Уникальная версия скрипта, чтобы сбрасывать кэш JS при загрузке новых приложений
    const version = Date.now(); 
    let selectedAppUrl = "";

    function openSheet() {
        document.getElementById("sheetOverlay").classList.add("active");
        document.getElementById("appSearchInput").value = "";
        filterApps(); 
    }

    function closeSheet() {
        document.getElementById("sheetOverlay").classList.remove("active");
    }

    function selectApp(url, name) {
        // Добавляем к ссылке случайный параметр анти-кэша (чтобы plist всегда скачивался свежий)
        selectedAppUrl = url + "&nocache=" + version;
        document.getElementById("selectedAppText").textContent = name;
        document.getElementById("statusMessage").classList.remove("show");
        closeSheet();
    }

    function filterApps() {
        const query = document.getElementById("appSearchInput").value.toLowerCase();
        const items = document.querySelectorAll(".sheet-item");

        items.forEach(item => {
            const appName = item.querySelector(".app-name").textContent.toLowerCase();
            if (appName.includes(query)) {
                item.style.display = "flex";
            } else {
                item.style.display = "none";
            }
        });
    }

    function startInstallation() {
        if (!selectedAppUrl) {
            alert("Пожалуйста, сначала выберите приложение из списка.");
            return;
        }
        const statusMsg = document.getElementById("statusMessage");
        statusMsg.classList.add("show");
        
        setTimeout(() => {
            window.location.href = selectedAppUrl;
        }, 800);
    }
</script>

</body>
</html>
